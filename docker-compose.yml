# PostgreSQL para servir el almacen (opcional: sin el, el tablero usa DuckDB).
#   docker compose up -d
#   DATABASE_URL=postgresql://retail:retail@localhost:5432/retail
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
